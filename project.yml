name: CleanScheduleGlass
options:
  bundleIdPrefix: app.cleanschedule
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  CleanScheduleGlass:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["**/.DS_Store"]
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cleanschedule.glassdemo
        INFOPLIST_KEY_CFBundleDisplayName: "课表·Glass"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CleanScheduleGlassTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: CleanScheduleGlass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cleanschedule.glassdemo.tests
  CleanScheduleGlassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CleanScheduleGlass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cleanschedule.glassdemo.uitests
schemes:
  CleanScheduleGlass:
    build:
      targets:
        CleanScheduleGlass: all
    test:
      gatherCoverageData: false
      targets:
        - name: CleanScheduleGlassTests
        - name: CleanScheduleGlassUITests
          parallelizable: false
